name: Build Yosys AppImage
on:
  workflow_dispatch:
    inputs:
      yosys_ref:
        description: "Yosys git ref (tag or branch); v0.67+ has built-in read_slang"
        required: false
        default: "v0.68"

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Install Build Dependencies
        run: |
          dnf update -y
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf clean all
          dnf makecache
          dnf install -y --enablerepo=powertools --enablerepo=epel \
            gcc-toolset-13 gcc-toolset-13-gcc-c++ \
            make wget curl tar xz unzip file git patch gawk \
            flex flex-devel m4 pkgconf-pkg-config which \
            python3.11 python3.11-devel \
            zlib-devel libffi-devel readline-devel \
            tcl tcl-devel libtommath libtommath-devel \
            gperf autoconf gmp-devel

      - name: Install CMake 3.30
        run: |
          CMAKE_VER=3.30.5
          wget -q "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz"
          tar xf "cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -C /opt
          ln -sfn "/opt/cmake-${CMAKE_VER}-linux-x86_64" /opt/cmake
          echo "/opt/cmake/bin" >> "${GITHUB_PATH}"

      - name: Build Bison 3.8.2
        run: |
          source /opt/rh/gcc-toolset-13/enable
          BISON_TARBALL=bison-3.8.2.tar.xz
          downloaded=0
          for url in \
            "https://ftp.gnu.org/gnu/bison/${BISON_TARBALL}" \
            "https://ftpmirror.gnu.org/gnu/bison/${BISON_TARBALL}" \
            "https://mirrors.kernel.org/gnu/bison/${BISON_TARBALL}"
          do
            if wget --tries=3 --timeout=30 -O "${BISON_TARBALL}" "${url}"; then
              downloaded=1
              break
            fi
          done
          test "${downloaded}" = 1
          tar xf "${BISON_TARBALL}"
          cd bison-3.8.2
          ./configure --prefix=/usr/local
          make -j2
          make install

      - name: Clone Yosys Source
        run: |
          git clone --depth 1 --branch "${{ inputs.yosys_ref }}" \
            https://github.com/YosysHQ/yosys.git
          cd yosys
          git submodule update --init --recursive

      - name: Build Yosys
        run: |
          source /opt/rh/gcc-toolset-13/enable
          export PATH="/usr/local/bin:/opt/cmake/bin:$PATH"
          cd yosys
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DPython3_EXECUTABLE="$(command -v python3.11)" \
            -DYOSYS_INSTALL_LIBRARY=ON \
            -DYOSYS_WITH_PYTHON=OFF
          cmake --build build --config Release -j2
          # Install directly into the AppDir
          cmake --install build --prefix "${GITHUB_WORKSPACE}/AppDir/usr" --strip

      - name: Build Static GMP (For Yices2)
        run: |
          source /opt/rh/gcc-toolset-13/enable
          # Try gmplib first, fallback to the main GNU mirror if it fails
          wget -q --tries=3 --timeout=15 https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz || \
          wget -q --tries=3 --timeout=15 https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xf gmp-6.3.0.tar.xz
          cd gmp-6.3.0
          ./configure --disable-shared --enable-static --prefix=/usr/local --disable-assembly
          make V=1 -j2
          make install
          
      - name: Build Yices2 (Formal Solver)
        run: |
          source /opt/rh/gcc-toolset-13/enable
          git clone https://github.com/SRI-CSL/yices2.git
          cd yices2
          autoconf
          ./configure --prefix="${GITHUB_WORKSPACE}/AppDir/usr"
          make -j2
          make install

      - name: Build SymbiYosys (sby)
        run: |
          git clone https://github.com/YosysHQ/sby.git
          cd sby
          make install PREFIX="${GITHUB_WORKSPACE}/AppDir/usr"

      - name: Build EQY
        run: |
          source /opt/rh/gcc-toolset-13/enable
          export PATH="${GITHUB_WORKSPACE}/AppDir/usr/bin:$PATH"
          
          mkdir -p /usr/share/yosys
          ln -sfn "${GITHUB_WORKSPACE}/AppDir/usr/share/yosys/include" /usr/share/yosys/include
          
          git clone https://github.com/YosysHQ/eqy.git
          cd eqy
          
          # Sync EQY commit to the exact date of the Yosys commit to prevent API drift
          YOSYS_DATE=$(git -C ../yosys log -1 --format=%cI)
          EQY_COMMIT=$(git rev-list -n 1 --before="$YOSYS_DATE" HEAD)
          git checkout "$EQY_COMMIT"
          echo "Synced EQY to commit $EQY_COMMIT from date $YOSYS_DATE"
          
          export YOSYS_DATDIR="${GITHUB_WORKSPACE}/AppDir/usr/share/yosys"
          make V=1 -j2
          make install PREFIX="${GITHUB_WORKSPACE}/AppDir/usr"

      - name: Prepare AppDir Structure
        run: |
          cat > AppDir/yosys.desktop <<EOF
          [Desktop Entry]
          Name=yosys
          Exec=yosys
          Icon=utilities-terminal
          Type=Application
          Categories=Development;
          EOF
          touch AppDir/utilities-terminal.svg

      - name: Bundle Libraries and Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-tool
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-tool
          
          LINUXDEPLOY_ARGS=(
            --appdir AppDir
            -e AppDir/usr/bin/yosys
            -e AppDir/usr/bin/yices
            -e AppDir/usr/bin/yices-smt2
            -d AppDir/yosys.desktop
            -i AppDir/utilities-terminal.svg
          )
          if [ -x AppDir/usr/bin/yosys-abc ]; then
            LINUXDEPLOY_ARGS+=(-e AppDir/usr/bin/yosys-abc)
          fi
          ./linuxdeploy-tool/AppRun "${LINUXDEPLOY_ARGS[@]}"
          
          # Replace default AppRun with a multiplexer using STRICT absolute paths
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export YOSYS_DATDIR="${HERE}/usr/share/yosys"
          
          TOOL="$1"
          case "$TOOL" in
            eqy|sby|yices|yices-smt2)
              shift
              exec "${HERE}/usr/bin/$TOOL" "$@"
              ;;
            *)
              exec "${HERE}/usr/bin/yosys" "$@"
              ;;
          esac
          EOF
          chmod +x AppDir/AppRun
          
          export ARCH=x86_64
          ./appimagetool-tool/AppRun AppDir yosys-RHEL8-x86_64.AppImage
          
      - name: Smoke test AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          chmod +x yosys-RHEL8-x86_64.AppImage
          
          echo "Testing Yosys..."
          ./yosys-RHEL8-x86_64.AppImage -V
          
          echo "Testing EQY..."
          ./yosys-RHEL8-x86_64.AppImage eqy -V
          
          echo "Testing Yices2..."
          ./yosys-RHEL8-x86_64.AppImage yices --version

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yosys-AppImage
          path: yosys-RHEL8-x86_64.AppImage
          retention-days: 7
